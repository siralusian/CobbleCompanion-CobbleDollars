    modId="cobblecompanion"
    type="required"
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"

# Ohne die eigentliche CobbleDollars-Mod kann diese Erweiterung nichts tun (anders als in Basis,
# wo Cobbledollars optional ist) - hier deshalb required.
[[dependencies.cobblecompanion_cobbledollars]]
    modId="cobbledollars"
    type="required"
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"

