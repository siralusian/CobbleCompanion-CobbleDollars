# CobbleCompanion: Basis wird zur Laufzeit als eigenes, separat installiertes Mod erwartet (siehe
# build.gradle-Kommentar zu compileOnly) - required, da diese Mod ohne Basis' CompanionScreen/
# Extension-API keine Funktion hat.
